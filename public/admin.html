<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Админка теста</title>
<style>
:root{--bg:#f3f5f2;--surface:#fff;--ink:#1b2a26;--muted:#5d6b66;--line:#d5dcd8;--accent:#0f5c4d;--accent-ink:#fff;--red:#c0201b}
@media (prefers-color-scheme:dark){:root{--bg:#10181a;--surface:#182224;--ink:#e6eeea;--muted:#9aaba5;--line:#2c3b3d;--accent:#56c2a6;--accent-ink:#08201a;--red:#ff6b64}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Georgia,serif;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
main{max-width:900px;margin:0 auto;padding:16px}
h1{font-size:1.5rem;margin:8px 0 12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:16px}
button,input{font:inherit}
input{padding:10px 12px;border:1.5px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);width:100%;max-width:320px}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:8px;padding:9px 16px;font-weight:700;cursor:pointer}
.btn.sec{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.del{background:transparent;color:var(--red);border:1.5px solid var(--red);padding:5px 10px;font-size:.9rem}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.muted{color:var(--muted);font-size:.95rem}.err{color:var(--red);font-weight:700}
.wrap{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:.95rem}
th,td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}.n{text-align:right;white-space:nowrap}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
</style>
</head>
<body>
<main id="app"></main>
<script>
const app=document.getElementById("app");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt=ms=>{if(ms==null)return"—";const s=Math.round(ms/1000);return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0")};
const ST={finished:"завершил",running:"проходит",abandoned:"не отправил ответы"};
let KEY="",DATA=null,tm=null;
try{KEY=sessionStorage.getItem("adm")||""}catch(e){}
async function call(path,body){
  const r=await fetch("/api/"+path,{method:body?"POST":"GET",headers:{"x-admin-key":KEY,"content-type":"application/json"},body:body?JSON.stringify(body):undefined});
  const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||"Ошибка сети");return d}
function login(msg){
  clearInterval(tm);
  app.innerHTML=`<div class="card"><h1>Админка теста</h1><label for="k"><b>Ключ администратора</b></label><br>
  <input id="k" type="password" autocomplete="current-password"> <button class="btn" id="ok">Войти</button>
  <p class="err">${esc(msg||"")}</p><p class="muted">Ключ — это значение переменной ADMIN_KEY в настройках Netlify.</p></div>`;
  const go=()=>{KEY=document.getElementById("k").value;load(true)};
  document.getElementById("ok").onclick=go;
  document.getElementById("k").onkeydown=e=>{if(e.key==="Enter")go()};
}
async function load(first){
  try{DATA=await call("admin/list");try{sessionStorage.setItem("adm",KEY)}catch(e){}draw();clearInterval(tm);tm=setInterval(()=>load(false),10000)}
  catch(e){if(first||/ключ/i.test(e.message)){try{sessionStorage.removeItem("adm")}catch(x){}login(e.message)}}
}
function draw(){
  const rows=DATA.rows,fin=rows.filter(r=>r.status==="finished").sort((a,b)=>b.score-a.score||a.timeMs-b.timeMs),rest=rows.filter(r=>r.status!=="finished");
  const place=new Map(fin.map((r,i)=>[r.key,i+1])),list=[...fin,...rest];
  app.innerHTML=`<h1>Админка теста</h1><div class="card"><div class="bar">
  <button class="btn" id="rf">Обновить</button><button class="btn sec" id="csv">Скачать CSV</button>
  <button class="btn del" id="all">Сбросить все попытки</button><span class="muted">Время на тест: ${Math.round(DATA.limitSec/60)} мин. Автообновление каждые 10 с.</span></div>
  <p class="muted">Участников: ${rows.length}. Завершили: ${fin.length}. Проходят сейчас: ${rows.filter(r=>r.status==="running").length}. Не отправили ответы: ${rows.filter(r=>r.status==="abandoned").length}.</p>
  <div class="wrap"><table><thead><tr><th class="n">Место</th><th>ФИО</th><th>Статус</th><th class="n">Баллы</th><th class="n">Время</th><th>Начало</th><th></th></tr></thead><tbody>
  ${list.map(r=>`<tr><td class="n">${place.get(r.key)||"—"}</td><td>${esc(r.name)}</td><td>${ST[r.status]}${r.late?" (опоздал)":""}</td><td class="n">${r.score==null?"—":r.score+"/"+DATA.total}</td><td class="n">${fmt(r.timeMs)}</td><td>${new Date(r.startedAt).toLocaleString("ru-RU")}</td><td><button class="btn del" data-k="${r.key}" data-n="${esc(r.name)}">Сбросить</button></td></tr>`).join("")||`<tr><td colspan="7" class="muted">Попыток пока нет.</td></tr>`}
  </tbody></table></div></div>`;
  document.getElementById("rf").onclick=()=>load(false);
  document.getElementById("csv").onclick=()=>{
    const q=v=>'"'+String(v).replace(/"/g,'""')+'"';
    const lines=[["Место","ФИО","Статус","Баллы","Всего","Время","Начало"].map(q).join(";")].concat(list.map(r=>[place.get(r.key)||"",r.name,ST[r.status],r.score??"",DATA.total,fmt(r.timeMs),new Date(r.startedAt).toLocaleString("ru-RU")].map(q).join(";")));
    const a=document.createElement("a");a.href=URL.createObjectURL(new Blob(["\ufeff"+lines.join("\r\n")],{type:"text/csv;charset=utf-8"}));a.download="rating.csv";a.click();URL.revokeObjectURL(a.href)};
  document.getElementById("all").onclick=async()=>{
    if(!confirm("Удалить ВСЕ попытки и рейтинг? Это нельзя отменить."))return;
    if(prompt('Для подтверждения введите слово «сбросить»')!=="сбросить")return;
    try{await call("admin/delete",{all:true});load(false)}catch(e){alert(e.message)}};
  app.querySelectorAll("button[data-k]").forEach(b=>b.onclick=async()=>{
    if(!confirm("Сбросить попытку: "+b.dataset.n+"? Человек сможет пройти тест заново."))return;
    try{await call("admin/delete",{key:b.dataset.k});load(false)}catch(e){alert(e.message)}});
}
if(KEY)load(true);else login();
</script>
</body>
</html>
